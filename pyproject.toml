[project]
name = "iplegends"
version = "0.1.0"
description = "IPL draft game — data pipeline"
requires-python = ">=3.11,<3.12"
dependencies = [
    "polars>=1.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
