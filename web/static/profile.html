<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profile · The Legends Almanack</title>
<meta name="description" content="Draft an all-time IPL XI from nineteen seasons of the real archive, then play out a season.">
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
<link rel="icon" type="image/png" sizes="512x512" href="/static/favicon-512.png">
<link rel="apple-touch-icon" sizes="180x180" href="/static/favicon-180.png">
<meta property="og:title" content="The Legends Almanack">
<meta property="og:description" content="Draft an all-time IPL XI from nineteen seasons of the real archive, then play out a season.">
<meta property="og:image" content="/static/og-image.png">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="/static/og-image.png">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="sheet">
  <div class="rig" aria-hidden="true">
    <svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
      <g fill="none" stroke="var(--gold)" stroke-width="1" opacity=".35">
        <line x1="380" y1="10" x2="60" y2="230"/>
        <line x1="380" y1="10" x2="140" y2="260"/>
        <line x1="380" y1="10" x2="230" y2="280"/>
        <line x1="380" y1="10" x2="320" y2="285"/>
      </g>
      <g fill="var(--gold)">
        <circle cx="60" cy="230" r="3.4"/><circle cx="140" cy="260" r="3.4"/>
        <circle cx="230" cy="280" r="3.4"/><circle cx="320" cy="285" r="3.4"/>
        <circle cx="380" cy="10" r="4.5"/>
      </g>
    </svg>
  </div>

  <div class="masthead">
    <a class="wordmark" href="/" style="text-decoration:none;color:inherit">
      <div class="crest"><img src="/static/logo-emblem.png" alt="" width="220" height="235"></div>
      <div>
        <span class="the">The</span>
        <h1>Legends <span class="leg">Almanack</span></h1>
      </div>
    </a>
    <div class="edition">
      <b>Indian Premier League</b><br>
      <span id="deckPill">…</span>
      <span id="authArea"></span>
    </div>
  </div>

  <!-- ============ PROFILE ============ -->
  <section id="profile">
    <div class="report">
      <div class="over-line">PLAYER CARD</div>
      <div class="call" id="profileUsername"></div>
    </div>

    <div class="folio" style="grid-template-columns:1fr 1fr">
      <div class="col">
        <div class="col-head"><span>Career</span></div>
        <div class="ledger" style="grid-template-columns:repeat(2,1fr);padding:22px">
          <div><b id="profileGames">–</b><span>GAMES PLAYED</span></div>
          <div><b id="profileTitles">–</b><span>TITLES WON</span></div>
        </div>
      </div>

      <div class="col">
        <div class="col-head"><span>Top scorers</span></div>
        <div id="profileBatters" class="col-scroll"></div>
      </div>
    </div>

    <div class="folio" style="grid-template-columns:1fr;margin-top:20px">
      <div class="col">
        <div class="col-head"><span>Top wicket-takers</span></div>
        <div id="profileBowlers" class="col-scroll"></div>
      </div>
    </div>

    <div class="foot-actions" style="justify-content:center;padding:26px 0 30px">
      <a class="act" href="/">Home</a>
    </div>
  </section>

  <div id="authOverlay" class="card-overlay hide" onclick="closeAuthModal(event)">
    <div class="scorecard-shell auth-frame">
      <div class="scorecard-frame">
        <div class="room-choices" id="authTabs" style="margin-bottom:20px">
          <button class="room-choice sel" data-tab="login" onclick="pickAuthTab('login')">Sign in</button>
          <button class="room-choice" data-tab="register" onclick="pickAuthTab('register')">Register</button>
        </div>
        <div id="authLoginPanel">
          <label class="room-label">Username or email</label>
          <input id="authLoginIdentifier" class="room-input" placeholder="Username or email">
          <label class="room-label" style="margin-top:14px">Password</label>
          <input id="authLoginPassword" type="password" class="room-input" placeholder="Password">
          <div class="actions" style="margin-top:18px">
            <button class="act lead" onclick="submitLogin(this)">Sign in</button>
          </div>
        </div>
        <div id="authRegisterPanel" class="hide">
          <label class="room-label">Username</label>
          <input id="authRegisterUsername" class="room-input" placeholder="3-24 characters" maxlength="24">
          <label class="room-label" style="margin-top:14px">Email</label>
          <input id="authRegisterEmail" class="room-input" placeholder="you@example.com">
          <label class="room-label" style="margin-top:14px">Password</label>
          <input id="authRegisterPassword" type="password" class="room-input" placeholder="At least 8 characters">
          <p class="room-note">No email verification or password reset yet -- pick a password you'll remember.</p>
          <div class="actions" style="margin-top:18px">
            <button class="act lead" onclick="submitRegister(this)">Create account</button>
          </div>
        </div>
        <div class="auth-error" id="authError"></div>
      </div>
      <div class="scorecard-close">
        <button class="act" onclick="closeAuthModal()">Close</button>
      </div>
    </div>
  </div>

  <div class="imprint">
    <div>The Legends Almanack · squads · selection · season</div>
    <div id="footStats"></div>
  </div>
</div>

<script src="/static/common.js"></script>
<script src="/static/auth.js"></script>
<script src="/static/profile.js"></script>
</body>
</html>
